<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nina no Mundo - Kids2gether</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --brand-mint: #75C9A6; --brand-yellow: #F9C850; --brand-navy: #2C3E50; }
        .bg-brand-mint { background-color: var(--brand-mint) !important; }
        .bg-brand-yellow { background-color: var(--brand-yellow); }
        .bg-brand-navy { background-color: var(--brand-navy); }
        body { font-family: 'Nunito', sans-serif; color: var(--brand-navy); overflow-x: hidden; }
        /* Responsive styles */
        @media (max-width: 768px) {
            body {
                font-size: 14px;
            }
            .container {
                padding: 0 10px;
            }
            nav .h-12 {
                height: 8rem;
            }
        }
        @media (max-width: 480px) {
            body {
                font-size: 12px;
            }
            .container {
                padding: 0 5px;
            }
        }
    </style>
</head>
